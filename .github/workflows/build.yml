name: Build Clocky WatchBridge IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-26
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          xcodebuild -version
          xcodebuild -showsdks | grep -i watchos || true

      - name: Build unsigned IPA
        run: bash build.sh

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Clocky-WatchBridge
          path: build/ipa/Clocky-WatchBridge.ipa
          if-no-files-found: error
